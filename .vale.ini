StylesPath = styles
MinAlertLevel = warning

Packages = https://github.com/stakater/vale-package/releases/download/v0.0.105/Stakater.zip
Vocab = Stakater

# Exclude non-prose HTML-level scopes from all checks.
SkippedScopes = script, style, pre, figure
IgnoredScopes = code, tt

# Only check MarkDown files
[*.md]

BasedOnStyles = Vale

# Ignore MkDocs macro syntax {{ variable_name }} so Vale does not flag
# template variables as spelling errors.
BlockIgnores = (\{\{[^}]+\}\})

# Ignore image URL paths (e.g. images/foo-bar.png) to avoid false positives
# on lowercase tool or brand names used as filenames.
TokenIgnores = (\([a-z0-9/_.-]+\.(png|jpg|jpeg|svg|gif|webp|pdf)\))
